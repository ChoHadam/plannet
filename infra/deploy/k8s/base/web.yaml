# Next.js Web. 외부 노출 없이 Gateway 뒤에서만 접근한다 (ClusterIP + NetworkPolicy).
# AI 호출 한도는 프로세스 메모리에 있으므로 replica 1개를 유지한다 (docs/web-auth-integration.md §4).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plannet-web
  labels:
    app.kubernetes.io/name: plannet-web
spec:
  replicas: 1
  # 롤링 중 두 프로세스가 각자 한도를 세지 않도록 먼저 내리고 올린다 (짧은 중단 발생).
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: plannet-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plannet-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # apps/web/Dockerfile 의 nextjs 사용자
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: plannet-web
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: plannet-web-config
            - configMapRef:
                name: plannet-public # overlay의 public.env (APP_ORIGINS 등)
          env:
            - name: OPENGATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: plannet-web-secret
                  key: OPENGATEWAY_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
            - name: tmp
              mountPath: /tmp
          # 요청마다 서버 설정을 읽는 동적 경로. 프로세스가 요청을 처리할 수 있는지 확인한다.
          readinessProbe:
            httpGet:
              port: http
              path: /api/runtime-config
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              port: http
              path: /api/runtime-config
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: plannet-web
spec:
  type: ClusterIP # 외부 진입은 Gateway만
  selector:
    app.kubernetes.io/name: plannet-web
  ports:
    - name: http
      port: 3000
      targetPort: http
