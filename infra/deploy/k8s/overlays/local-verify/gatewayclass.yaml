# 검증 클러스터의 Envoy 프록시를 NodePort로 고정해 kind 호스트 포트(19643/19680)에 연결한다.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: plannet
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: plannet-verify
    namespace: envoy-gateway-system
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: plannet-verify
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
      envoyService:
        type: NodePort
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 443
                  nodePort: 30443
                - port: 80
                  nodePort: 30080
