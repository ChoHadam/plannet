# overlay의 public.env → ConfigMap plannet-public 의 PUBLIC_HOST 를 Gateway·HTTPRoute host에 채운다.
# 공개 주소 관련 값은 overlay의 public/public.env 한 곳에서만 바꾼다.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
  - source:
      kind: ConfigMap
      name: plannet-public
      fieldPath: data.PUBLIC_HOST
    targets:
      - select:
          kind: Gateway
          name: plannet
        fieldPaths:
          - spec.listeners.*.hostname
      - select:
          kind: HTTPRoute
          name: plannet-app
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: HTTPRoute
          name: plannet-https-redirect
        fieldPaths:
          - spec.hostnames.0
