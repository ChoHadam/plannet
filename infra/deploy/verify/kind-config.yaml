# 로컬 검증 전용 kind 클러스터. Envoy 프록시 NodePort(30443/30080)를 호스트 127.0.0.1:19643/19680에 연결한다.
# 호스트 포트는 scripts/lib.sh 의 VERIFY_HTTPS_PORT/VERIFY_HTTP_PORT 와 같아야 한다 (verify-local.sh가 치환). overlays/local-verify 의 주소와도 같아야 한다..
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: ${VERIFY_HTTPS_PORT}
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30080
        hostPort: ${VERIFY_HTTP_PORT}
        listenAddress: 127.0.0.1
        protocol: TCP
