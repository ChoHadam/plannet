services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 128mb
    entrypoint: [/bin/bash, /opt/plannet/entrypoint.sh]
    command: [postgres]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/plannet/admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      PLANNET_DATABASE: ${PLANNET_DATABASE:?Run db.sh init first}
      PLANNET_APP_ROLE: ${PLANNET_APP_ROLE:?Run db.sh init first}
    ports:
      - "127.0.0.1:${PLANNET_PG_PORT:?Run db.sh init first}:5432"
    volumes:
      # PostgreSQL 18 puts its major-version data directory under this mount.
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./entrypoint.sh:/opt/plannet/entrypoint.sh:ro
    tmpfs:
      - /run/plannet:mode=0700
    secrets:
      - admin_password
      - app_password
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  pgdata:
    name: ${PLANNET_PG_VOLUME:?Run db.sh init first}

secrets:
  admin_password:
    file: ${PLANNET_ADMIN_PASSWORD_FILE:?Run db.sh init first}
  app_password:
    file: ${PLANNET_APP_PASSWORD_FILE:?Run db.sh init first}
